spring.application.name=backend
server.servlet.contextPath=/api
spring.mvc.pathmatch.matching-strategy = ANT_PATH_MATCHER

jwt.secret=${JWT_SECRET}
spring.mongodb.host=${SPRING_DATA_MONGODB_HOST}
spring.mongodb.port=${SPRING_DATA_MONGODB_PORT}
spring.mongodb.database=${SPRING_DATA_MONGODB_DATABASE}
spring.mongodb.username=${SPRING_DATA_MONGODB_USERNAME}
spring.mongodb.password=${SPRING_DATA_MONGODB_PASSWORD}
spring.mongodb.authentication-database=${SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE}
cors.allowed.origins.localhost=${CORS_ALLOWED_ORIGINS_LOCALHOST}
cors.allowed.origins.production=${CORS_ALLOWED_ORIGINS_PRODUCTION}

#oauth2 credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}
spring.security.oauth2.client.registration.google.scope=${GOOGLE_SCOPE}
spring.security.oauth2.client.provider.google.authorization-uri=${GOOGLE_AUTHORIZATION_URI}
spring.security.oauth2.client.provider.google.token-uri=${GOOGLE_TOKEN_URI}
spring.security.oauth2.client.provider.google.issuer-uri=${GOOGLE_ISSUER_URI}

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.redirect-uri=${GITHUB_REDIRECT_URI}
auth.default.success.url=${AUTH_DEFAULT_SUCCESS_URL}
auth.logout.success.url=${AUTH_LOGOUT_SUCCESS_URL}